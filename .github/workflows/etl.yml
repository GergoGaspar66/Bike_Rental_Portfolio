name: Bike Rental ETL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  etl_job:
    runs-on: ubuntu-latest
    environment: SUPABASE 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 

      - name: Set up Python
        uses: actions/setup-python@v6 
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas psycopg2-binary python-dotenv jupyter nbconvert

      - name: Run ETL Notebook
        env:
          SUPABASE_PW: ${{ secrets.SUPABASE_PW }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_REF }} 
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          jupyter nbconvert --to notebook --execute Bike_rental.ipynb --output Bike_rental_out.ipynb
