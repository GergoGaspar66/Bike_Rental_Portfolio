name: Bike Rental ETL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  etl_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # Upgraded to v6 to natively use Node 24

      - name: Set up Python
        uses: actions/setup-python@v6 # Upgraded to v6 to natively use Node 24
        with:
          python-version: '3.11'
          # Removed cache: 'pip' to eliminate the missing requirements.txt warning

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas psycopg2-binary python-dotenv jupyter nbconvert

      - name: Run ETL Notebook
        env:
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          jupyter nbconvert --to notebook --execute Bike_rental.ipynb --output Bike_rental_out.ipynb
