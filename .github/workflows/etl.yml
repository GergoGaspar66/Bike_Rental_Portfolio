name: Bike Rental ETL

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
 
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  etl_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 

      - name: Set up Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.11'
          cache: 'pip' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas psycopg2-binary python-dotenv jupyter nbconvert

      - name: Run ETL Notebook
        env:
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          jupyter nbconvert --to notebook --execute Bike_rental.ipynb --output Bike_rental_out.ipynb
